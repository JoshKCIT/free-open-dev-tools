name: CI

# A push or pull request rechecks only what its changes reach (the plan job
# below works it out and explains every file in its summary). The nightly run
# and the Run workflow button check everything.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

# Any failing job here blocks the deploy workflow, which requires this one.
# A newer push cancels an older push's run. Full runs have a group of their
# own, so a push never cancels a full run and a full run never holds up a push.
concurrency:
  group: ci-${{ github.ref }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full' || 'changes' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Work out what this change needs checked
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      browser: ${{ steps.plan.outputs.browser }}
      grep_invert: ${{ steps.plan.outputs.grep_invert }}
      standalone: ${{ steps.plan.outputs.standalone }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # TypeScript is what tells a comment-only edit from a real one.
      - name: Install
        run: pnpm install --frozen-lockfile

      # A push is compared with the newest commit that already passed CI, not
      # with the previous push: if a push failed, the next one still rechecks
      # what the failed one changed.
      - name: List the commits that already passed CI
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=100" \
            --jq '.workflow_runs[].head_sha' > "$RUNNER_TEMP/passed.txt" || : > "$RUNNER_TEMP/passed.txt"

      - name: Skip the nightly run if this commit already had a full run
        id: nightly
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # If GitHub's API cannot be asked, run the nightly rather than fail it.
          count=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&status=success&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "CI" and (.event == "schedule" or .event == "workflow_dispatch"))] | length') || count=0
          if [ "$count" -gt 0 ]; then echo "already=true" >> "$GITHUB_OUTPUT"; fi

      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          ALREADY: ${{ steps.nightly.outputs.already }}
        run: |
          if [ "$ALREADY" = true ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "This commit already passed a full run, so tonight's run has nothing new to check." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          case "$EVENT" in
            push) set -- --base-candidates "$RUNNER_TEMP/passed.txt" ;;
            pull_request) set -- --base "$PR_BASE" ;;
            *) set -- --full ;;
          esac
          node scripts/affected-tools.mjs "$@" --head HEAD --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  static:
    name: Static checks and unit tests
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.run == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # A clean, frozen install. If the lockfile does not match the manifests,
      # this fails rather than quietly resolving something different.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Regenerate the catalog and check it is complete
        run: pnpm run catalog

      - name: Sync the generated tool files
        run: pnpm run sync

      - name: Fail if generated files are out of date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated files are out of date. Run 'pnpm sync && pnpm catalog' and commit the result."
            git --no-pager diff --stat
            exit 1
          fi

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Unit tests
        run: pnpm exec vitest run --reporter=default --reporter=json --outputFile=test-results/unit.json

      - name: Catalog, documentation and no-transmission gate
        run: pnpm run check:catalog

      - name: Standalone package structure
        run: pnpm run check:standalone

      - name: Dependency licences and third-party notices
        run: pnpm run check:licenses

      - name: Forbidden reference gate
        run: pnpm run check:provenance
        env:
          PROVENANCE_DENYLIST: ${{ secrets.PROVENANCE_DENYLIST }}

      - name: Fail if the notices file changed
        run: |
          if [ -n "$(git status --porcelain docs/THIRD-PARTY.md)" ]; then
            echo "docs/THIRD-PARTY.md is out of date. Run 'pnpm check:licenses' and commit the result."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: test-results/unit.json
          retention-days: 14

  audit:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.run == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Only production dependencies reach a visitor's browser, so a high or
      # critical advisory there is a release blocker.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      # Development dependencies are reported but do not block, because they
      # never ship. They still need to be seen.
      - name: Audit development dependencies (advisory)
        run: pnpm audit --audit-level moderate || true

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  browser:
    name: Browser and privacy verification
    runs-on: ubuntu-latest
    needs: [plan, static]
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.browser != 'none'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      # Tests run against the production build, so what is verified is what
      # would be deployed, not a development server.
      - name: Build
        run: pnpm run build:web
        env:
          VITE_BASE: /
          VITE_COMMIT: ${{ github.sha }}

      # On a push, tests of tools the change does not reach are left out by
      # name; the plan job's summary lists which tools run and why.
      - name: Browser tests, including the privacy harness
        run: |
          if [ -n "$E2E_GREP_INVERT" ]; then
            pnpm exec playwright test --grep-invert "$E2E_GREP_INVERT"
          else
            pnpm exec playwright test
          fi
        env:
          PROVENANCE_DENYLIST: ${{ secrets.PROVENANCE_DENYLIST }}
          E2E_GREP_INVERT: ${{ needs.plan.outputs.grep_invert }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  standalone:
    name: Each tool folder works on its own
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.standalone != 'none'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Deliberately uses npm, not pnpm, and copies each folder to a temporary
      # directory outside the workspace. That is what a developer who runs
      # `npx degit` actually gets, so it is what has to work.
      - name: Install, build and test each tool folder in isolation
        env:
          ONLY: ${{ needs.plan.outputs.standalone }}
        run: |
          if [ "$ONLY" = all ]; then
            node scripts/check-standalone.mjs --full
          else
            node scripts/check-standalone.mjs --full "--only=$ONLY"
          fi

  # Runs when every check it needs passed or was not needed for this change.
  release-manifest:
    name: Release manifest
    runs-on: ubuntu-latest
    needs: [plan, static, browser, audit, standalone]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.run == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: unit-test-results
          path: test-results
        continue-on-error: true

      - uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: .
        continue-on-error: true

      - name: Build the manifest from the real results
        run: pnpm run manifest

      - name: Summary
        run: |
          echo '## Release manifest' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          head -30 docs/RELEASE-MANIFEST.md >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: |
            docs/RELEASE-MANIFEST.json
            docs/RELEASE-MANIFEST.md
          retention-days: 90
