# Broken: a Deployment whose selector.matchLabels does not match its own
# template labels (Kubernetes Deployment page: "as long as the Pod template
# itself satisfies the rule" -- here it does not).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: web
          image: nginx
